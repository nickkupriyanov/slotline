name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance attestation.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs the history to find the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turns an opaque publish failure into a readable diagnosis: an empty,
      # invalid or under-scoped NPM_TOKEN is the usual cause of a red Release.
      - name: Verify the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty or the secret is missing. Add it under Settings → Secrets and variables → Actions, and name it exactly NPM_TOKEN."
            exit 1
          fi
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN does not authenticate: $who"
            echo "::error::Recreate it as a granular access token: Packages and scopes → Read and write, All packages, and Bypass two-factor authentication (2FA) checked."
            exit 1
          fi
          echo "::notice::npm token authenticates as $who"

      # Opens (or updates) the "Version Packages" pull request. Merging that PR
      # runs `pnpm release`, which builds both packages and publishes them.
      # changesets publishes the core before the React binding, because the
      # binding depends on it.
      #
      # v2 renamed every input: version→version-script, publish→publish-script,
      # commit→commit-message, title→pr-title. The old names are ignored
      # silently, not rejected. v2 also creates the git tags and GitHub releases
      # (both default to true), which v1 never did — hence the missing tags.
      # It authenticates through `github-token`, not the GITHUB_TOKEN env var.
      - name: Create the release PR, or publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
        env:
          # npm authenticates through the .npmrc that actions/setup-node
          # generates, and that file interpolates NODE_AUTH_TOKEN. Setting
          # NPM_TOKEN instead leaves the token unread: npm publishes
          # anonymously and the registry answers E404 on the PUT.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
