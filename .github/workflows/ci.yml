name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads `packageManager` from package.json (pnpm 9.8.0).
      - uses: pnpm/action-setup@v4

      # 24 is the LTS that satisfies vitest's `^22.12.0 || ^24.0.0 || >=26.0.0`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the packed packages install in a clean app
        run: pnpm verify:install

      - name: Build the playground
        run: pnpm --filter @nickkupriyanov/slotline-playground build

      # jsdom has no layout engine, so the width invariant is measured in a real
      # browser. The runner ships Chrome at /usr/bin/google-chrome, which
      # tools/screenshot.mjs already looks for.
      - name: Layout guard (real Chrome)
        run: |
          pnpm --filter @nickkupriyanov/slotline-playground preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/gallery.html && break
            sleep 1
          done
          node tools/check-layout.mjs

      - name: Build Storybook
        run: pnpm build-storybook
