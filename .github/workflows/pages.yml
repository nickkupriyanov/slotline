name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm build

      # The project page lives at /slotline/, so the playground's assets must be
      # requested from there. Locally the base stays `/`.
      - name: Build the playground for the project page subpath
        env:
          PAGES_BASE: /slotline/
        run: pnpm --filter @nickkupriyanov/slotline-playground build

      # Storybook emits relative asset URLs (./assets/…), so it needs no base.
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Assemble the site
        run: |
          mkdir -p site/storybook
          cp -r apps/playground/dist/. site/
          cp -r packages/react/storybook-static/. site/storybook/
          touch site/.nojekyll
          find site -maxdepth 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
